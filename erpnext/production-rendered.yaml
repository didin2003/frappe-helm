# Source: erpnext/templates/job-configure-bench.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: production-erpnext-conf-bench-20261127105339
  labels:
    helm.sh/chart: erpnext-8.0.83
    app.kubernetes.io/name: erpnext
    app.kubernetes.io/instance: production
    app.kubernetes.io/version: "v16.37.0"
    app.kubernetes.io/managed-by: Helm
spec:
  backoffLimit: 0
  template:
    spec:
      serviceAccountName: production-erpnext
      initContainers:
      - name: frappe-bench-ownership
        image: didin8080/frappe-build-test:1
        imagePullPolicy: IfNotPresent
        command: ['sh', '-c']
        args:
          - chown -R "1000:1000" /home/frappe/frappe-bench/sites /home/frappe/frappe-bench/logs
        resources:
          {}
        securityContext:
          # run as root to set ownership
          runAsUser: 0
        volumeMounts:
          - name: sites-dir
            mountPath: /home/frappe/frappe-bench/sites
          - name: logs
            mountPath: /home/frappe/frappe-bench/logs
      securityContext:
        supplementalGroups:
        - 1000
      containers:
      - name: configure
        image: "didin8080/frappe-build-test:1"
        imagePullPolicy: IfNotPresent
        command:
          - bash
          - -c
        args:
          - >
            ls -1 apps > sites/apps.txt;
            [[ -f sites/common_site_config.json ]] || echo "{}" > sites/common_site_config.json;
            bench set-config -gp db_port $DB_PORT;
            bench set-config -g db_host $DB_HOST;
            CACHE_PASS_ESCAPED=$(python3 -c 'import os,urllib.parse; print(urllib.parse.quote(os.environ["REDIS_CACHE_PASSWORD"],safe=""))');
            QUEUE_PASS_ESCAPED=$(python3 -c 'import os,urllib.parse; print(urllib.parse.quote(os.environ["REDIS_QUEUE_PASSWORD"],safe=""))');

            REDIS_CACHE_URL="redis://${REDIS_CACHE_USERNAME}:${CACHE_PASS_ESCAPED}@${REDIS_CACHE_HOST}:${REDIS_CACHE_PORT}";
            REDIS_QUEUE_URL="redis://${REDIS_QUEUE_USERNAME}:${QUEUE_PASS_ESCAPED}@${REDIS_QUEUE_HOST}:${REDIS_QUEUE_PORT}";

            bench set-config -g redis_cache "$REDIS_CACHE_URL";
            bench set-config -g redis_queue "$REDIS_QUEUE_URL";
            bench set-config -g redis_socketio "$REDIS_QUEUE_URL";
            bench set-config -gp socketio_port $SOCKETIO_PORT;
        env:
          - name: DB_HOST
            value: "proxysql.database.svc.cluster.local"
          - name: DB_PORT
            value: "6033"
          - name: REDIS_CACHE_HOST
            value: "192.168.1.151"
          - name: REDIS_CACHE_PORT
            value: "13000"
          - name: REDIS_CACHE_USERNAME
            value: "default"
          - name: REDIS_CACHE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: external-redis-credentials
                key: cache-password
          - name: REDIS_QUEUE_HOST
            value: "192.168.1.152"
          - name: REDIS_QUEUE_PORT
            value: "11000"
          - name: REDIS_QUEUE_USERNAME
            value: "default"
          - name: REDIS_QUEUE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: external-redis-credentials
                key: queue-password
          - name: SOCKETIO_PORT
            value: "9000"
        resources:
          {}
        volumeMounts:
          - name: sites-dir
            mountPath: /home/frappe/frappe-bench/sites
          - name: logs
            mountPath: /home/frappe/frappe-bench/logs
      restartPolicy: Never
      volumes:
        - name: sites-dir
          persistentVolumeClaim:
            claimName: production-erpnext
            readOnly: false
        - name: logs
          emptyDir: {}
